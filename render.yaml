# Free Render web service for Spades Royale logins, friends, invites and gifts.
# One click: https://render.com/deploy?repo=https://github.com/spades-arena/spades-arena.github.io
services:
  - type: web
    name: spades-royale
    runtime: node
    plan: free
    buildCommand: echo "no build needed"
    startCommand: node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '20'
      # Owner account with unlimited Lions & Diamonds (its password is typed in on Render, never stored in the code)
      - key: SPADES_ADMIN_USERNAME
        value: hadzz
      - key: SPADES_ADMIN_PASSWORD
        sync: false
      # Free Upstash Redis (upstash.com) keeps accounts safe when the free server sleeps. Paste the REST URL and token.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
