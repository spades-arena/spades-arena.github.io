plugins {
    id 'com.android.application'
}

// Optional release signing: set ANDROID_KEYSTORE_FILE / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
// (GitHub Actions secrets). Without them the APK is signed with a debug key, which still installs fine.
def ks = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.hadzz.spadesroyale'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hadzz.spadesroyale'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType ks.endsWith('.p12') ? 'pkcs12' : 'jks'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
