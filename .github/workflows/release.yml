# Builds Spades Royale for Android, Windows and Mac on GitHub's free servers,
# publishes them as a GitHub Release, and deploys the download site to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  VERSION: 1.0.${{ github.run_number }}
  # Set this repo variable once the free Render server is up, e.g. wss://spades-royale.onrender.com/ws
  SPADES_SERVER_URL: ${{ vars.SPADES_SERVER_URL }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the game
        run: |
          python3 bundle.py
          mkdir -p web/assets
          cp index.html manifest.json web/
          cp assets/icon-192.png assets/icon-512.png web/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: android/app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Optional release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          VERSION_NAME: ${{ env.VERSION }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Spades-Royale.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Spades-Royale.apk

  desktop:
    needs: web
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: dist:win
            file: desktop/dist/Spades-Royale-Windows-Setup.exe
          - os: macos-latest
            target: dist:mac
            file: desktop/dist/Spades-Royale-Mac.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: desktop/app
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build installer
        working-directory: desktop
        shell: bash
        run: |
          cp ../assets/icon-512.png icon.png
          npm install --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.file }}

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Spades Royale ${{ env.VERSION }}
          make_latest: 'true'
          body: |
            Spades Royale — Play. Win. Rule. Made by Hadzz.
            Download for Android (.apk), Windows (.exe) or Mac (.dmg) below.
          files: |
            out/Spades-Royale.apk
            out/Spades-Royale-Windows-Setup.exe
            out/Spades-Royale-Mac.dmg

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: _site/play
      - name: Build download site
        run: |
          mkdir -p _site/assets
          sed -e "s#__REPO__#${GITHUB_REPOSITORY}#g" -e "s#__VERSION__#${VERSION}#g" site/index.html > _site/index.html
          cp assets/logo.jpg assets/signature.png assets/icon-192.png _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
